<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payday Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a big walkable town with a daytime clock fills the screen; frosted-glass HUD on top (clock, 4 money accounts, quest tracker), D-pad / phone / A button at the bottom. Events arrive on an in-game phone instead of popping up. Single deliberate light look. */
:root {
  color-scheme: light;
  --sky-a: #6fd3ff;  --sky-b: #b8f2c9;
  --ink: #0f1b3d;    --ink-2: #3a4770;
  --glass: rgba(255, 255, 255, 0.74);
  --glass-line: rgba(255, 255, 255, 0.9);
  --shadow: 0 10px 34px rgba(18, 40, 110, 0.28);
  --blue: #1e7bff;  --aqua: #12c2c2;  --lime: #3cc35f;  --sun: #ffb21e;
  --pink: #ff4f9a;  --grape: #8a5cff; --red: #ef3b4f;  --gray: #8a93a8;
  --good: #11914a;  --bad: #d4243a;
  --font-head: "Prompt", "Leelawadee UI", "Tahoma", sans-serif;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink);
  background: linear-gradient(160deg, var(--sky-a), var(--sky-b));
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.num { font-family: var(--font-head); font-variant-numeric: tabular-nums; font-weight: 600; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; line-height: 1.25; }
h2 { font-size: 21px; } h3 { font-size: 17px; }
p { margin: 0; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.glass {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; box-shadow: var(--shadow), inset 0 1px 0 #fff;
  -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6);
}

/* ---------- HUD ---------- */
.hud { position: fixed; top: calc(6px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto; padding: 7px 9px; z-index: 5; display: flex; flex-direction: column; gap: 5px; }
.hud .r1 { display: flex; align-items: center; gap: 6px; }
.clock { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-family: var(--font-head); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; }
.clock .mo { background: linear-gradient(180deg, #fff, #dff1ff); border-radius: 10px; padding: 1px 8px; color: var(--blue); box-shadow: inset 0 0 0 1px rgba(30,123,255,.25); }
.clock .tm { font-variant-numeric: tabular-nums; }
.iconbtn { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 13px; border: 1px solid var(--glass-line); background: linear-gradient(180deg, #fff, #e3f0ff); font-size: 18px; cursor: pointer; box-shadow: 0 3px 10px rgba(18,40,110,.18); padding: 0; color: var(--ink); }
.bar { height: 7px; border-radius: 99px; background: rgba(15,27,61,.12); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s; }
.bar.mp i { background: linear-gradient(90deg, #ff8ac2, var(--pink)); }
.bar.time i { background: linear-gradient(90deg, #ffd56b, var(--sun)); transition: none; }
.accts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 5px; }
.acct { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.95);
  background: rgba(255,255,255,.72); font: inherit; font-size: 12.5px; color: var(--ink-2); cursor: pointer; text-align: left; transition: background .3s; }
.acct b { font-family: var(--font-head); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.acct .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.acct.up { background: rgba(170,240,190,.95); } .acct.down { background: rgba(255,200,208,.95); }
.acct small { font-family: var(--font-head); font-weight: 600; }
.mprow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.mprow .chipx { font-family: var(--font-head); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.mprow .debt { color: var(--bad); }
#tracker { display: flex; flex-direction: column; gap: 3px; }
.trk { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: var(--font-head); cursor: pointer; border: 0; text-align: left; color: var(--ink); width: 100%; }
.trk span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.trk small { font-weight: 500; white-space: nowrap; }
.trk.forced { background: #ffe1e5; } .trk.quest { background: #fff1c9; } .trk.invite { background: #e5efff; }

/* ---------- bottom controls ---------- */
.pad { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: 150px; height: 150px; z-index: 5; }
.pad button { position: absolute; width: 52px; height: 52px; border-radius: 16px; border: 1px solid var(--glass-line); background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(214,234,255,.8)); font-size: 21px; color: var(--ink); box-shadow: 0 4px 12px rgba(18,40,110,.22); touch-action: none; cursor: pointer; }
.pad button.on { background: linear-gradient(180deg, #bfe2ff, #8fcaff); }
.pad .u { left: 49px; top: 0; } .pad .d { left: 49px; bottom: 0; } .pad .l { left: 0; top: 49px; } .pad .r { right: 0; top: 49px; }
.abtn { position: fixed; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 80px; height: 80px; border-radius: 50%; z-index: 5;
  border: 2px solid rgba(255,255,255,.95); color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 1.05; cursor: pointer;
  background: radial-gradient(circle at 35% 25%, #8fd0ff, var(--blue) 60%, #0b4fc2); box-shadow: 0 8px 20px rgba(11,79,194,.45), inset 0 2px 0 rgba(255,255,255,.6); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.abtn small { display: block; font-size: 11px; font-weight: 500; }
.phonebtn { position: fixed; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-10%); z-index: 5; width: 62px; height: 74px; border-radius: 18px; cursor: pointer;
  border: 2px solid rgba(255,255,255,.95); background: linear-gradient(180deg, #2b3557, #121a33); color: #fff; font-size: 26px; box-shadow: 0 8px 20px rgba(15,27,61,.4); font-family: var(--font-head); padding: 0; }
.phonebtn small { display: block; font-size: 10px; font-weight: 600; }
.phonebtn .nbadge { position: absolute; top: -7px; right: -7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; }
#ticker { position: fixed; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(176px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: 70%; }
#ticker div { padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; font-family: var(--font-head); background: rgba(255,255,255,.88); box-shadow: 0 2px 8px rgba(18,40,110,.18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tin .25s ease-out; }
#ticker .m { color: var(--bad); } #ticker .p { color: var(--good); } #ticker .n { color: var(--ink-2); }
@keyframes tin { from { transform: translateX(-12px); opacity: 0; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(190px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 8px 16px; font-weight: 600; font-family: var(--font-head); font-size: 15px; width: max-content; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }

/* phone notification banner */
.notif { position: fixed; z-index: 9; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); width: min(440px, calc(100% - 20px)); transform: translate(-50%, -150%); transition: transform .35s cubic-bezier(.2,.9,.3,1.2);
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 20px; cursor: pointer; background: rgba(28,34,60,.88); color: #fff; box-shadow: 0 12px 30px rgba(10,20,60,.4);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.25); }
.notif.show { transform: translate(-50%, 0); }
.notif .ic { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255,255,255,.16); }
.notif .tx { min-width: 0; font-size: 14px; line-height: 1.35; }
.notif .tx b { display: block; font-family: var(--font-head); font-size: 14px; }
.notif .tx span { opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.notif.urgent .ic { background: var(--red); }

/* ---------- modal panels ---------- */
.scrim { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(12, 36, 90, 0.24);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.panel { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 11px; }
.panel .head { display: flex; gap: 12px; align-items: center; }
.badge { flex: 0 0 auto; width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-size: 27px; background: linear-gradient(180deg, #fff, #dff1ff); box-shadow: inset 0 0 0 1px rgba(30,123,255,.2); }
.muted { color: var(--ink-2); font-size: 14px; }
.foot { font-size: 13px; color: var(--ink-2); text-align: center; }
.card { background: rgba(255,255,255,.8); border-radius: 16px; padding: 11px 13px; border: 1px solid rgba(255,255,255,.95); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; }
.btn { font-family: var(--font-head); font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; min-height: 46px; padding: 9px 12px; border-radius: 14px; text-align: center;
  border: 1px solid rgba(255,255,255,.95); background: linear-gradient(180deg, #ffffff 0%, #eef6ff 50%, #dcebff 51%, #e9f3ff 100%); box-shadow: 0 3px 10px rgba(18,40,110,.16); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 4px rgba(18,40,110,.2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .pick:focus-visible, input:focus-visible, .abtn:focus-visible, .pad button:focus-visible, .iconbtn:focus-visible, .acct:focus-visible, .trk:focus-visible, .phonebtn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn.primary, .btn.green, .btn.warn, .btn.danger { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); border-color: rgba(255,255,255,.7); }
.btn.primary { background: linear-gradient(180deg, #7cc4ff 0%, #2f8dff 50%, #1268f0 51%, #2a86ff 100%); }
.btn.green { background: linear-gradient(180deg, #8ae89c 0%, #34b857 50%, #1f9440 51%, #36b656 100%); }
.btn.warn { background: linear-gradient(180deg, #ffd27a 0%, #ffa51e 50%, #e98600 51%, #ffa01e 100%); }
.btn.danger { background: linear-gradient(180deg, #ff9aa8 0%, #ef3b4f 50%, #c91f33 51%, #e9384d 100%); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: 13px; border-radius: 11px; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.menu .btn { text-align: left; font-size: 14.5px; }
.menu .btn.wide { grid-column: 1 / -1; text-align: center; }
ol.rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
label.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; cursor: pointer; }
label.check input { width: 24px; height: 24px; flex: 0 0 24px; margin-top: 2px; accent-color: var(--blue); }
dl.terms { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 15px; }
dl.terms dt { font-weight: 600; white-space: nowrap; } dl.terms dd { margin: 0; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-family: var(--font-head); font-size: 15px; }
input[type=text], input[type=number] { font: inherit; font-family: var(--font-body); font-weight: 500; width: 100%; padding: 9px 11px; border-radius: 12px; border: 1px solid rgba(30,123,255,.35); background: rgba(255,255,255,.95); color: var(--ink); user-select: text; -webkit-user-select: text; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips .btn { flex: 1 1 auto; min-height: 38px; padding: 5px 8px; font-size: 14px; }
.chips .btn[aria-pressed="true"] { border-color: var(--blue); background: linear-gradient(180deg, #e8f4ff, #cfe6ff); box-shadow: 0 0 0 3px rgba(30,123,255,.18); }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick { font: inherit; text-align: left; color: var(--ink); cursor: pointer; padding: 10px; min-height: 48px; display: flex; gap: 8px; align-items: flex-start; border-radius: 14px; border: 2px solid rgba(255,255,255,.9); background: rgba(255,255,255,.65); }
.pick[aria-pressed="true"] { border-color: var(--blue); background: linear-gradient(180deg, #e8f4ff, #cfe6ff); box-shadow: 0 0 0 3px rgba(30,123,255,.18); }
.pick .ic { font-size: 26px; line-height: 1; }
.pick b { display: block; font-family: var(--font-head); font-size: 15px; }
.pick span.d { display: block; font-size: 13.5px; color: var(--ink-2); }
.big { font-family: var(--font-head); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hint { font-size: 14px; padding: 8px 12px; border-radius: 12px; background: #fff6dc; border: 1px solid #ffe3a0; }
.hint.red { background: #ffe5e9; border-color: #ffc2cb; color: #9b1c2e; }
.hint.blue { background: #eaf3ff; border-color: #c8ddff; }

/* money distribution rows */
.drow { display: grid; grid-template-columns: 1fr 118px; gap: 4px 8px; align-items: center; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.8); border-left: 5px solid var(--c, var(--gray)); }
.drow .lbl { min-width: 0; } .drow b { display: block; font-family: var(--font-head); font-size: 15px; }
.drow small { display: block; color: var(--ink-2); font-size: 13px; line-height: 1.3; }
.drow input { text-align: right; font-family: var(--font-head); font-weight: 600; padding: 7px 9px; }
.drow .qc { grid-column: 1 / -1; display: flex; gap: 5px; }
.drow .qc .btn { flex: 1; min-height: 30px; padding: 2px 4px; font-size: 12.5px; border-radius: 9px; }
.remain { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lines { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.lines div { display: flex; justify-content: space-between; gap: 8px; }
.lines b { font-family: var(--font-head); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* encounter scene */
.foe { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.orb { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 48px; line-height: 1;
  background: radial-gradient(circle at 35% 28%, #fff, rgba(255,255,255,.4) 45%, rgba(30,123,255,.25)); box-shadow: inset 0 -6px 14px rgba(18,40,110,.18), 0 8px 18px rgba(18,40,110,.22); }
.orb.boss { background: radial-gradient(circle at 35% 28%, #fff, rgba(255,210,220,.5) 45%, rgba(239,59,79,.45)); }
.foe .name { font-family: var(--font-head); font-weight: 700; font-size: 19px; line-height: 1.2; }
.foe .sub { font-family: var(--font-head); font-weight: 600; color: var(--ink-2); }
.speech { background: rgba(255,255,255,.92); border-radius: 16px; padding: 11px 13px; min-height: 70px; font-size: 16px; cursor: pointer; position: relative; border: 1px solid #fff; }
.speech .more { position: absolute; right: 12px; bottom: 6px; color: var(--blue); animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
.shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pulse { animation: pulse .6s ease-in-out 2; } @keyframes pulse { 50% { transform: scale(1.08); } }
.mini { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }

/* monster card */
.mcard { display: grid; grid-template-columns: 60px 1fr; gap: 12px; }
.mcard .orb { width: 60px; height: 60px; font-size: 34px; }
.mcard .kind { font-size: 13.5px; color: var(--ink-2); }
.stars { color: var(--sun); letter-spacing: 2px; text-shadow: 0 1px 0 rgba(0,0,0,.15); }
.stat { display: grid; grid-template-columns: 84px 1fr 60px; gap: 8px; align-items: center; font-size: 13.5px; }
.stat .sbar { height: 9px; border-radius: 99px; background: rgba(15,27,61,.1); overflow: hidden; }
.stat .sbar i { display: block; height: 100%; border-radius: 99px; }
.stat .val { text-align: right; font-family: var(--font-head); font-weight: 600; }
.ad { font-size: 13.5px; background: #fff4cf; border-radius: 10px; padding: 4px 8px; }
.trait { font-size: 13.5px; font-weight: 600; } .trait.badt { color: var(--bad); }

/* phone */
.phone { max-width: 400px; padding: 0; gap: 0; background: rgba(245,248,255,.86); border-radius: 30px; border: 3px solid rgba(255,255,255,.95); overflow: hidden; height: min(720px, 100%); }
.phone .ptop { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 6px; font-family: var(--font-head); font-weight: 600; font-size: 13px; color: var(--ink-2); }
.phone .ptitle { padding: 0 16px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.phone .pbody { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
.phone .ptabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,.85); border-top: 1px solid rgba(15,27,61,.08); }
.ptab { border: 0; background: none; cursor: pointer; font: inherit; font-size: 11px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0; border-radius: 12px; position: relative; font-family: var(--font-head); font-weight: 600; }
.ptab .i { font-size: 21px; line-height: 1.1; }
.ptab[aria-current="true"] { background: #e3efff; color: var(--blue); }
.ptab .dot { position: absolute; top: 2px; right: 18%; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--red); color: #fff; font-size: 11px; display: grid; place-items: center; }
.nitem { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 9px 10px; border-radius: 16px; background: #fff; border: 1px solid rgba(15,27,61,.06); }
.nitem.unread { box-shadow: inset 4px 0 0 var(--blue); }
.nitem .ni { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 21px; background: #eef4ff; }
.nitem b { font-family: var(--font-head); font-size: 14.5px; display: block; }
.nitem .t { font-size: 13.5px; color: var(--ink-2); line-height: 1.35; }
.nitem .when { font-size: 12px; color: var(--gray); }
.acrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 16px; background: #fff; }
.acrow .ni { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: #eef4ff; }
.acrow b.v { font-family: var(--font-head); font-size: 17px; font-variant-numeric: tabular-nums; }
.acrow small { display: block; color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.mon { padding: 10px 12px; border-radius: 16px; background: #fff; display: flex; flex-direction: column; gap: 4px; }
.mon .tp { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mon .tp b { font-family: var(--font-head); }
.mon svg { width: 100%; height: 40px; display: block; }
.gl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.gl b { display: block; font-family: var(--font-head); font-size: 14.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.up { color: var(--good) !important; } .down { color: var(--bad) !important; }
.txl { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.txl div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 4px 2px; border-bottom: 1px solid rgba(15,27,61,.06); }
.txl b { font-family: var(--font-head); font-variant-numeric: tabular-nums; }

function genMap() {
  for (let y = 0; y < MH; y++) { map[y] = []; for (let x = 0; x < MW; x++) map[y][x] = G; }
  const set = (x, y, t) => { if (x >= 0 && y >= 0 && x < MW && y < MH) map[y][x] = t; };
  const isRoad = (x, y) => RH.some((r) => y === r || y === r + 1) || RV.some((r) => x === r || x === r + 1);
  // parks: tall grass meadows where wild monsters live
  for (let y = 16; y <= 21; y++) for (let x = 2; x <= 17; x++) set(x, y, TALL);

  // town square
  for (let y = 15; y <= 22; y++) for (let x = 22; x <= 39; x++) set(x, y, PAVE);
  for (let y = 18; y <= 19; y++) for (let x = 30; x <= 31; x++) set(x, y, WATER);

// Bigger bills: you choose where the money comes from.
async function payFlow(cost, what, optional, cat, e) {
  let remain = Math.round(cost), usedSave = false; const parts = [];
  while (remain > 0.5) {
    const sellable = S.team.filter((m) => !m.scam && m.value > 1);
    const c = await choose([
      { k: "wallet", label: `👛 บัญชีเงินเดือน<br><span class="num">${baht(S.wallet)}</span>`, cls: "primary", disabled: S.wallet < 1 },
      { k: "left", label: `💰 เงินเหลือ<br><span class="num">${baht(S.left)}</span>`, disabled: S.left < 1 },
      { k: "save", label: `🐷 เงินเก็บ<br><span class="num">${baht(S.save)}</span>`, disabled: S.save < 1 },
      { k: "card", label: "💳 รูดบัตร<br><small>ดอกเบี้ยสมมติ 16%/ปี</small>", cls: "danger" },
      { k: "sell", label: "🎒 ขายมอน", disabled: !sellable.length },
      ...(optional ? [{ k: "skip", label: "🏃 ไม่เอาดีกว่า" }] : []),
    ]);
    if (["wallet", "left", "save"].includes(c.k)) {
      const pay = Math.min(S[c.k], remain); S[c.k] -= pay; remain -= pay; parts.push(ACC[c.k].e); if (c.k === "save") usedSave = true;
      Sound.hit(); anim("orb", "shake"); sceneStats();
      await say(`จ่ายจาก${ACC[c.k].n} ${baht(pay)}` + (remain > 0.5 ? ` ยังขาดอีก ${baht(remain)}` : " เรียบร้อย!"));
    } else if (c.k === "card") {
      S.debt += remain; S.stats.cardUses++; parts.push("💳"); Sound.bad(); sceneStats();
      await say(`รูดบัตรไป ${baht(remain)} กลายเป็นหนี้ ถ้าค้างเกิน 1 เดือน ระบบจะหักจากบัญชีให้อัตโนมัติ`); remain = 0;
    } else if (c.k === "sell") {
      const m = await pickMonster(sellable, "ขายมอนตัวไหน?"); if (!m) continue;
      const D = SPECIES[m.sp], sold = Math.min(m.value, remain / D.liq), got = sold * D.liq;
      m.value -= sold; remain -= got; parts.push(D.e); if (m.value < 1) S.team = S.team.filter((t) => t !== m);
      Sound.coin(); sceneStats();
      await say(`ขาย${D.name}ได้ ${baht(got)}` + (D.liq < 1 ? ` (ขายด่วนเสียส่วนต่าง ${baht(sold - got)})` : "") + (remain > 0.5 ? ` ยังขาดอีก ${baht(remain)}` : ""));
    } else if (c.k === "skip") { S.mp = clamp(S.mp - 6, 0, 100); sceneStats(); await say(`ไม่เอา${what}แล้ว (ความสุข −6)`); return false; }
  }
  if (usedSave) S.stats.shieldUses++;
  record(e || "🧾", what, -Math.round(cost), parts.join("+"), cat);
  return true;
}

      + S.invites.map((v, i) => `<div class="qcard"><div class="ni">${v.e}</div><div><b>${v.status === "accepted" ? "♥ " : "ชวน: "}${esc(v.title)}</b><div class="t">${esc(v.text)}</div><div class="meta"><span class="cost">${baht(v.cost)}</span><span>+${v.mp} ✨</span><span>📍 ${bname(v.to)}</span><span>${v.deadline != null ? `⏳ เหลือ ${mmss(cdLeft(v))}` : `ตอบรับใน ${Math.max(0, v.due - S.day)} วัน`}</span></div></div>${v.status === "accepted" ? navBtn("v" + i, v) : ""}</div>`).join("")
      + `<p class="muted">ภารกิจ ${S.questsDone} · งานเสริม ${S.jobsDone}</p>`;

      <div class="acrow"><div class="ni">💳</div><div><b>หนี้บัตร</b><small>ค้างเกิน 1 เดือน โดนหักเอง</small></div><b class="v ${S.debt > 0.5 ? "down" : ""}">${baht(S.debt)}</b></div>

      <div class="row"><button class="btn green" id="dLeft" ${S.left < 1 ? "disabled" : ""}>💰 แบ่งเงินเหลือ</button><button class="btn" id="dWallet" ${S.wallet < 1 ? "disabled" : ""}>👛 แบ่งเงินเดือน</button></div>

      <div class="hint blue">📈 ขึ้นลงทุกวัน · ค่าธรรมเนียมหักทีละนิด · ใส่เงินเพิ่มที่ 👛 กระเป๋า</div>`
      + S.team.map((m) => { const D = SPECIES[m.sp], g = m.value - m.invested, gp = m.invested > 0 ? (m.value / m.invested - 1) * 100 : 0;
        return `<div class="mon"><div class="tp"><b>${ico("m-" + m.sp)}${D.name}</b><span class="muted">${D.kind}</span></div>
          ${sparkSVG(m.hist, g >= 0 ? "#11914a" : "#d4243a")}

          <div class="gl"><div>เดือนนี้<b class="${m.mGrow >= 0 ? "up" : "down"}">${m.mGrow >= 0 ? "+" : ""}${baht(m.mGrow)}</b></div><div>ค่าธรรมเนียม<b class="down">-${baht(m.mFee)}</b></div><div>ค่าพลัง<b>${m.known ? `${m.scam ? "???" : m.ret + "%/ปี"}` : "???"}</b></div></div></div>`; }).join("")
      + (S.team.length ? "" : `<p class="muted">ยังไม่มีมอน ไปจับในทุ่งลงทุน 🌾</p>`)
      + `<p class="foot">ตัวเลขจำลอง ไม่ใช่คำแนะนำการลงทุน</p>`;
  }
  if (phoneTab === "help") { title = "วิธีเล่น"; body = helpHTML(); }
  const h = hourNow() % 24;
  const p = modal(`<div class="ptop"><span>📱 PayPhone</span><span>เดือน ${S.month} · วันที่ ${S.day} · ${String(Math.floor(h)).padStart(2, "0")}:${String(Math.floor((h % 1) * 6) * 10).padStart(2, "0")}</span></div>
    <div class="ptitle"><h2>${title}</h2><button class="btn sm" id="pClose">ปิด ✕</button></div>
    <div class="pbody">${body}</div>
    <div class="ptabs">${tabs.map(([k, i, n, b]) => `<button class="ptab" data-t="${k}" aria-current="${k === phoneTab}"><span class="i">${i}</span>${n}${b ? `<span class="dot">${b}</span>` : ""}</button>`).join("")}</div>`, "phone");
  $("#pClose", p).onclick = () => { Sound.blip(); closePhone(); };
  p.querySelectorAll(".ptab").forEach((b) => (b.onclick = () => { Sound.blip(); phoneTab = b.dataset.t; renderPhone(); }));
  p.querySelectorAll("[data-acc]").forEach((b) => (b.onclick = () => { const n = S.inbox.find((x) => x.id === +b.dataset.acc); const v = n.invite, bd = BMAP[v.to], dist = Math.abs(bd.dx - P.x) + Math.abs(bd.dy - P.y), lim = Math.round(clamp(20 + dist * 0.45, 30, 60));
    v.status = "accepted"; v.deadline = S.t + lim; v.cdTotal = lim; v.due = CFG.days; S.focus = v; trackerKey = ""; Sound.coin(); toast(`⏳ ไป${bd.name}ให้ทันใน ${lim} วิ!`); renderPhone(); }));
  p.querySelectorAll("[data-dec]").forEach((b) => (b.onclick = () => { const n = S.inbox.find((x) => x.id === +b.dataset.dec); S.invites = S.invites.filter((v) => v !== n.invite); S.mp = clamp(S.mp - 4, 0, 100); Sound.blip(); renderPhone(); }));
  const qc = $("#qCancel", p); if (qc) qc.onclick = () => { S.quest = null; Sound.blip(); renderPhone(); };
  p.querySelectorAll("[data-nav]").forEach((b) => (b.onclick = () => { const k = b.dataset.nav, ref = k === "q" ? S.quest : k[0] === "f" ? S.forced[+k.slice(1)] : S.invites[+k.slice(1)]; if (ref) { setFocus(ref); renderPhone(); } }));
  const dl = $("#dLeft", p); if (dl) dl.onclick = async () => { await distPanel({ src: "left", title: "แบ่งเงินเหลือ", cancel: true }); renderPhone(); };
  const dw = $("#dWallet", p); if (dw) dw.onclick = async () => { await distPanel({ src: "wallet", title: "แบ่งเงินเดือน", cancel: true, hint: (r) => `<div class="hint">🍜 เหลือค่ากินไว้ด้วย (ถึงสิ้นเดือน ~${baht(MEAL_AVG * MEALS_PER_DAY * Math.max(1, CFG.days - S.day + 1))})</div>` }); renderPhone(); };
}
function navBtn(k, ref) {
  const on = targets()[0] && targets()[0].ref === ref;
  return `<div class="act"><button class="btn sm ${on ? "" : "primary"}" data-nav="${k}" ${on ? "disabled" : ""}>${on ? "🧭 กำลังไป" : "🧭 ไปอันนี้ก่อน"}</button></div>`;
}
function qMeta(q) {
  return q.kind === "job" ? `<span class="pay">ค่าจ้างตามฝีมือ</span><span>🎮 มินิเกม</span>` : q.payAmt ? `<span class="pay">+${baht(q.payAmt)}</span>` : q.cost ? `<span class="cost">${baht(q.cost)}</span>${q.mp ? `<span>+${q.mp} ✨</span>` : ""}` : `<span>ฟรี</span>`;
}

/* ================= minigames (≤ 30 s, harder = more pay) ================= */
const DIFF = { easy: { n: "ง่าย", pay: 0.025 }, mid: { n: "ปานกลาง", pay: 0.05 }, hard: { n: "ยาก", pay: 0.085 } };
const MG = {
  fruit: { e: "🍎", name: "คัดผลไม้", how: "แตะผลไม้ดีให้ไว ห้ามแตะของเสีย", sec: { easy: 20, mid: 20, hard: 20 } },
  cash: { e: "🧮", name: "แคชเชียร์ทอนเงิน", how: "เลือกเงินทอนที่ถูกต้อง ผิดโดนหักคะแนน", sec: { easy: 25, mid: 25, hard: 25 } },
  match: { e: "🧩", name: "จับคู่หนังสือ", how: "เปิดการ์ดทีละ 2 ใบ หาคู่ให้ครบ", sec: { easy: 30, mid: 30, hard: 30 } },
};
const jobPay = (diff) => Math.round(S.salary * DIFF[diff].pay / 10) * 10;
function miniGame(game, diff) {
  return new Promise((resolve) => {
    const M = MG[game], sec = M.sec[diff];
    const target = game === "fruit" ? { easy: 12, mid: 18, hard: 24 }[diff] : game === "cash" ? { easy: 7, mid: 8, hard: 8 }[diff] : { easy: 6, mid: 8, hard: 10 }[diff];
    const p = modal(`<div class="head"><div class="badge">${M.e}</div><div><h2>${M.name}</h2><div class="muted">${DIFF[diff].n} · ${M.how}</div></div></div>
      <div class="card"><p>🎯 <b>${target}</b> คะแนน · ⏱️ <b>${sec}</b> วิ · 💰 สูงสุด <b>${baht(jobPay(diff))}</b></p></div>
      <button class="btn green" id="mgGo">เริ่ม!</button>`);
    $("#mgGo", p).onclick = () => {
      Sound.blip(); mode = "job";
      const q = modal(`<div class="head"><div class="badge">${M.e}</div><div><h2>${M.name}</h2><div class="muted">${DIFF[diff].n}</div></div></div>
        <div class="mgtop"><span>คะแนน <b id="mgS">0</b> / ${target}</span><span id="mgT">${sec} วิ</span></div><div class="bar time"><i id="mgBar" style="width:100%"></i></div><div id="mgA"></div>`);
      const area = $("#mgA", q); let score = 0, ended = false; const timers = [];
      const setScore = (d) => { score = Math.max(0, score + d); $("#mgS").textContent = score; };
      const t0 = performance.now();
      const finish = () => { if (ended) return; ended = true; timers.forEach((t) => { clearInterval(t); clearTimeout(t); }); resolve(clamp(score / target, 0, 1)); };
      timers.push(setInterval(() => { const el = (performance.now() - t0) / 1000, left = Math.max(0, sec - el); const b = $("#mgBar"); if (b) b.style.width = (left / sec) * 100 + "%"; const t = $("#mgT"); if (t) t.textContent = Math.ceil(left) + " วิ"; if (left <= 0) finish(); }, 100));
      if (game === "fruit") {
        const n = diff === "easy" ? 3 : 4, spawn = { easy: 650, mid: 520, hard: 400 }[diff], life = { easy: 1400, mid: 1050, hard: 780 }[diff], badR = { easy: 0.25, mid: 0.33, hard: 0.4 }[diff];
        area.innerHTML = `<div class="mg-grid" style="grid-template-columns:repeat(${n},1fr)">${Array.from({ length: n * n }, (_, i) => `<button class="mg-cell" data-i="${i}" aria-label="ช่อง ${i + 1}"></button>`).join("")}</div>`;
        const cells = [...area.querySelectorAll(".mg-cell")];
        cells.forEach((c) => (c.onclick = () => { if (!c.dataset.k) return; const good = c.dataset.k === "g"; setScore(good ? 1 : -1); (good ? Sound.coin : Sound.hit).call(Sound); c.classList.add(good ? "ok" : "no"); c.innerHTML = ""; c.dataset.k = ""; setTimeout(() => c.classList.remove("ok", "no"), 180); }));
        let tokN = 0;
        timers.push(setInterval(() => {
          const free = cells.filter((c) => !c.dataset.k); if (!free.length) return;
          const c = pick(free), bad = Math.random() < badR; c.dataset.k = bad ? "b" : "g";
          c.innerHTML = `<img src="${imgSrc(bad ? "g-bad" + rint(0, 3) : "g-good" + rint(0, 6))}" alt="${bad ? "ของเสีย" : "ผลไม้ดี"}">`;
          const tk = String(++tokN); c.dataset.tok = tk; timers.push(setTimeout(() => { if (c.dataset.tok === tk && c.dataset.k) { c.innerHTML = ""; c.dataset.k = ""; } }, life));
        }, spawn));
      }
      if (game === "cash") {
        const next = () => {
          let price, paid, txt;
          if (diff === "easy") { price = rint(12, 95); paid = 100; txt = `ราคา ${baht(price)} ลูกค้าจ่าย ${baht(paid)}`; }
          else if (diff === "mid") { price = rint(105, 480); paid = 500; txt = `ราคา ${baht(price)} ลูกค้าจ่าย ${baht(paid)}`; }
          else { const a = rint(35, 290), b = rint(35, 290); price = a + b; paid = 1000; txt = `ของ ${baht(a)} + ${baht(b)} ลูกค้าจ่าย ${baht(paid)}`; }
          const ch = paid - price, set = new Set([ch]);
          const deltas = diff === "easy" ? [10, -10, 5, -5] : [10, -10, 1, -1, 100, -100];
          while (set.size < (diff === "easy" ? 3 : 4)) { const v = ch + pick(deltas); if (v > 0) set.add(v); }
          const opts = shuffle([...set]);
          area.innerHTML = `<img class="mg-cashier" src="${imgSrc("g-cashier")}" alt=""><div class="mg-q">${txt}<small>ต้องทอนเท่าไร?</small></div><div class="mg-opts">${opts.map((v) => `<button class="btn" data-v="${v}">${baht(v)}</button>`).join("")}</div>`;
          area.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => { if (ended) return; const ok = +b.dataset.v === ch; setScore(ok ? 1 : -1); (ok ? Sound.coin : Sound.hit).call(Sound); next(); }));
        };
        next();
      }
      if (game === "match") {
        const pairs = target, icons = Array.from({ length: pairs }, (_, i) => i);
        const face = (i) => `<img src="${imgSrc("g-book" + i)}" alt="หนังสือ ${i + 1}">`, back = `<img src="${imgSrc("g-book11")}" alt="?">`;
        const deck = shuffle([...icons, ...icons]); let open = [], lock = false;
        area.innerHTML = `<div class="mg-grid" style="grid-template-columns:repeat(${pairs > 8 ? 5 : 4},1fr)">${deck.map((e, i) => `<button class="mg-card" data-i="${i}" aria-label="การ์ด ${i + 1}">${back}</button>`).join("")}</div>`;
        const cards = [...area.querySelectorAll(".mg-card")];
        cards.forEach((c) => (c.onclick = () => {
          if (lock || ended || c.classList.contains("open") || c.classList.contains("done")) return;
          c.classList.add("open"); c.innerHTML = face(deck[+c.dataset.i]); open.push(c); Sound.blip();
          if (open.length === 2) {
            const [a, b] = open; open = [];
            if (deck[+a.dataset.i] === deck[+b.dataset.i]) { a.classList.add("done"); b.classList.add("done"); setScore(1); Sound.coin(); if (score >= pairs) setTimeout(finish, 300); }
            else { lock = true; setTimeout(() => { a.classList.remove("open"); b.classList.remove("open"); a.innerHTML = back; b.innerHTML = back; lock = false; }, 550); }
          }
        }));
      }
    };
  });
}
async function doJob(game, bonus) {
  scene({ e: MG[game].e, name: "งานเสริม: " + MG[game].name, sub: "≤ 30 วิ" });
  textEl.textContent = "เลือกความยาก ยิ่งยาก ยิ่งได้มาก";
  const c = await choose([
    ...Object.entries(DIFF).map(([k, d]) => ({ k, label: `${d.n}<br><span class="num">สูงสุด ${baht(jobPay(k) * bonus)}</span>`, cls: k === "hard" ? "warn" : k === "mid" ? "primary" : "" })),
    { k: "no", label: "ไว้ก่อน" },
  ]);
  if (c.k === "no") return false;
  const perf = await miniGame(game, c.k);
  mode = "busy";

  else { Sound.bad(); await say("ยังไม่ได้เงิน ลองระดับง่ายลงนะ"); }
  return true;
}

/* ================= month cycle ================= */
function monthIncome() {
  let f = 1; if (S.cls === "freelance") f = rand(0.5, 1.5); if (S.cls === "shop") f = rand(0.45, 1.75);
  let inc = S.salary * (1 + S.raise) * f * (1 - S.lastIncomeHit); S.lastIncomeHit = 0;
  if (S.cls === "office" && S.month === S.months) inc += S.salary;
  return Math.round(inc);
}
async function startMonth() {
  const home = BMAP.home; P.x = P.tx = home.dx; P.y = P.ty = home.dy + 1; P.fx = P.x; P.fy = P.y; P.t = 1; P.dir = "down";
  Object.assign(S, { t: 0, day: 1, forced: [], invites: [], quest: null, cat: {}, walk: 0, talked: new Set(), mflag: {}, gym: Math.max(0, S.gym - 1), carcheck: Math.max(0, S.carcheck - 1) });
  S.team.forEach((m) => { m.mStart = m.value; m.mIn = 0; m.mGrow = 0; m.mFee = 0; });
  renderExplore(); mode = "busy";
  await payday();
  for (const p of S.pending.filter((p) => p.m <= S.month)) pendingNote(p);
  S.pending = S.pending.filter((p) => p.m > S.month);
  S.sched = buildSchedule(); planMeals(); refreshBoard(); spawnWild();
  closeModal(); mode = "explore";
  S.sched.filter((x) => x.day === 1).forEach(fire);
  updateHUD();
  toast(S.month === 1 ? "🏠 ไปจ่ายค่าเช่าที่บ้านก่อน (ตามลูกศร)" : `เดือนที่ ${S.month} เริ่มแล้ว!`);
}
function payday() {
  // interest, overdue auto-deduction, installments, then salary in
  const notes = [];
  if (S.debt > 0.5) { const it = Math.round(S.debt * 0.16 / 12); S.debt += it; S.debtOld += it; S.stats.cardInterest += it; notes.push(["💳 ดอกเบี้ยบัตร", it]); }
  S.income = monthIncome(); S.incomeTotal += S.income; S.wallet += S.income; record("💼", "เงินเดือนเข้า", S.income, "👛", null);
  if (S.installment) { const p = Math.min(S.wallet, S.installment); S.wallet -= p; if (S.installment > p) S.debt += S.installment - p; record("📲", "ค่างวดมือถือ", -S.installment, "👛", "bills"); notes.push(["📲 ค่างวดมือถือ", S.installment]); }
  const autoLines = [];
  const overdue = Math.min(S.debtOld, S.debt);
  if (overdue > 0.5) {
    let rem = overdue;
    for (const k of ["wallet", "left", "save"]) { const p = Math.min(S[k], rem); if (p > 0) { S[k] -= p; payDebt(p); rem -= p; autoLines.push(`${ACC[k].e} ${ACC[k].n} −${baht(p)}`); } }
    if (rem > 0.5) for (const m of S.team.filter((m) => !m.scam && m.value > 1).sort((a, b) => b.value - a.value)) {
      const D = SPECIES[m.sp], sell = Math.min(m.value, rem / D.liq), got = sell * D.liq; m.value -= sell; payDebt(got); rem -= got; autoLines.push(`${D.e} ขาย${D.name} ${baht(got)}`);
      if (m.value < 1) S.team = S.team.filter((t) => t !== m); if (rem <= 0.5) break;
    }
    S.stats.autoDebt += overdue - Math.max(0, rem); record("⚠️", "หักหนี้บัตรที่ค้างเกิน 1 เดือนอัตโนมัติ", -Math.round(overdue - Math.max(0, rem)), "auto", null);
  }
  S.debtOld = S.debt;
  const cl = CLASSES[S.cls];
  const rent = Math.max(3000, Math.round(S.salary * 0.22 / 100) * 100), util = Math.round(S.salary * 0.04 / 10) * 10, tel = Math.max(399, Math.round(S.salary * 0.02 / 100) * 100 - 1), food = Math.round(MEAL_AVG * MEALS_PER_DAY * CFG.days / 100) * 100;
  const est = rent + util + tel + food + 1500;
  const vals = {};
  for (const k in S.lastAlloc) if (k === "save" || S.team.some((m) => "m:" + m.id === k)) vals[k] = Math.min(S.lastAlloc[k], S.wallet);
  const head = `<div class="card"><div class="lines">
      <div><span>💼 เงินเดือนเข้า${S.cls === "office" && S.month === S.months ? " (+โบนัส)" : ""}</span><b class="up">+${baht(S.income)}</b></div>
      ${notes.map(([n, v]) => `<div><span>${n}</span><b class="down">${baht(v)}</b></div>`).join("")}
    </div>${S.cls === "freelance" || S.cls === "shop" ? `<p class="muted">${cl.ic} เดือนนี้รายได้${S.income >= S.salary ? "ดีกว่า" : "น้อยกว่า"}ปกติ</p>` : ""}</div>
    ${autoLines.length ? `<div class="hint red"><b>⚠️ หนี้ค้างเกิน 1 เดือน โดนหัก ${baht(overdue)}</b><br>${autoLines.join(" · ")}</div>` : ""}`;
  const hint = (rem) => `<div class="card"><b style="font-family:var(--font-head)">เดือนนี้ต้องจ่ายประมาณ</b><div class="lines" style="margin-top:4px">
      <div><span>🏠 ค่าเช่า</span><b>${baht(rent)}</b></div><div><span>💡 ค่าน้ำไฟ</span><b>~${baht(util)}</b></div><div><span>📶 ค่าโทร + เน็ต</span><b>${baht(tel)}</b></div>
      <div><span>🍜 ค่ากิน</span><b>~${baht(food)}</b></div><div><span>🛵 จิปาถะ</span><b>~${baht(1500)}</b></div>
      <div><span><b>รวม</b></span><b>~${baht(est)}</b></div></div></div>
    ${rem < est ? `<div class="hint">⚠️ เหลือ ${baht(rem)} อาจไม่พอใช้ทั้งเดือน</div>` : ""}`;
  return (async () => {
    for (;;) {
      const r = await distPanel({ src: "wallet", e: "💰", title: `เดือนที่ ${S.month} · เงินเดือนออก!`, sub: "แบ่งไปเก็บ/ลงทุนเท่าไร? ที่เหลือไว้ใช้", head, vals, hint,
        extra: S.left >= 1 ? [{ k: "left", label: `💰 แบ่งเงินเหลือเดือนก่อน (${baht(S.left)})` }] : [], okLabel: "ยืนยัน ออกไปใช้ชีวิต" });
      if (r.extra === "left") { await distPanel({ src: "left", title: "แบ่งเงินเหลือ", cancel: true }); continue; }
      S.lastAlloc = { ...r.vals };
      break;
    }
  })();
}
function pendingNote(p) {
  if (p.kind === "repay") { income(p.amt, "gift", "เพื่อนคืนเงินที่ยืม", "💸"); notify({ e: "💸", title: "เพื่อนคืนเงินแล้ว +" + baht(p.amt), text: "คืนตามสัญญา", tab: "wallet" }); }
  if (p.kind === "raise") { S.raise += 0.05; notify({ e: "📜", title: "ขึ้นเงินเดือน 5%", text: "มีผลเดือนหน้า", tab: "inbox" }); }

/* ================= walking: arrival, doors, interactions ================= */
let busy = false;
async function run(fn) {
  if (busy) return; busy = true; mode = "busy"; held.clear(); document.querySelectorAll(".pad .on").forEach((b) => b.classList.remove("on"));
  try { await fn(); } catch (e) { console.error(e); } finally {
    busy = false;
    if (S && !S.over && mode === "busy") { closeModal(); mode = "explore"; updateHUD(); }
  }
}
function arrived() {
  if (!S || mode !== "explore") return;
  S.walk++; if (S.walk % 3 === 0) Sound.step();
  const t = map[P.y][P.x];
  if (t === DOOR) { const b = BUILDINGS.find((b) => b.dx === P.x && b.dy === P.y); if (b) return run(() => enterBuilding(b)); }
  if (S.walk >= S.nextSmall) { S.walk = 0; S.nextSmall = rint(16, 30); smallEvent(); }
}
function smallEvent() {
  const ev = pick(SMALL);
  if (ev.c) { quickPay(rint(ev.c[0], ev.c[1]), "other", ev.t, ev.e); if (ev.mp) S.mp = clamp(S.mp + ev.mp, 0, 100); }
  else income(rint(ev.g[0], ev.g[1]), "gift", ev.t, ev.e);
}
function interact() {
  if (mode !== "explore" || !S) return;
  const near = (x, y) => Math.abs(x - P.x) + Math.abs(y - P.y) === 1;
  const [ax, ay] = DIRS[P.dir];
  const n = NPCS.find((n) => n.x === P.x + ax && n.y === P.y + ay) || NPCS.find((n) => near(n.x, n.y));
  if (n) return run(() => talk(n));
  const w = S.wild.find((m) => near(m.x, m.y));
  if (w) return run(() => catchEvent(w));
  if (Math.abs(BOARD_POS.x - P.x) + Math.abs(BOARD_POS.y - P.y) <= 1) return run(openBoard);
  const b = BUILDINGS.find((b) => Math.abs(b.dx - P.x) + Math.abs(b.dy - P.y) <= 1);
  if (b) return run(() => enterBuilding(b));
  toast("ตรงนี้ว่าง ลองไปที่ประตู คน ❗ หรือบอร์ด 📋");
}
function stepOut(b) { P.x = P.tx = b.dx; P.y = P.ty = b.dy + (b.door === "down" ? 1 : -1); P.fx = P.x; P.fy = P.y; P.t = 1; P.dir = b.door; }

/* ---------- quest board ---------- */
function openBoard() {
  return new Promise((resolve) => {
    const blocked = S.forced.length > 0, busyQ = !!S.quest;
    const p = modal(`<div class="head"><div class="badge">📋</div><div><h2>บอร์ดภารกิจ</h2><div class="muted">รับได้ทีละ 1 · เปลี่ยนทุก 5 วัน</div></div></div>
      ${blocked ? `<div class="hint red">⚠️ จ่ายบิลก่อน: ${S.forced.map((f) => esc(f.title)).join(", ")}</div>` : busyQ ? `<div class="hint">★ กำลังทำ "${esc(S.quest.title)}" อยู่</div>` : ""}
      ${S.board.map((q, i) => `<div class="qcard"><div class="ni">${q.e}</div><div><b>${esc(q.title)}</b><div class="t">${esc(q.text)}</div>
        <div class="meta">${qMeta(q)}<span>📍 ${q.from ? bname(q.from) + " → " : ""}${bname(q.to)}</span><span>${q.days} วัน</span></div></div>
        <div class="act"><button class="btn sm ${blocked || busyQ ? "" : "green"}" data-i="${i}" ${blocked || busyQ ? "disabled" : ""}>รับภารกิจ</button></div></div>`).join("") || `<p class="muted">บอร์ดว่าง รออีกไม่กี่วัน</p>`}
      <button class="btn primary" id="bx">ปิด</button>`);
    p.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => {
      const q = S.board[+b.dataset.i]; S.quest = { ...q, stage: q.from ? "pickup" : "go", due: Math.min(CFG.days, S.day + q.days) };
      S.board.splice(+b.dataset.i, 1); Sound.appear(); toast(`★ ${q.title} → ${bname(q.from || q.to)}`); resolve();
    }));
    $("#bx", p).onclick = () => { Sound.blip(); resolve(); };
  });
}
async function questAt(b) {
  const q = S.quest;
  if (q.stage === "pickup" && q.from === b.id) { q.stage = "go"; Sound.coin(); await say(`รับของแล้ว ${q.e} → ไปส่งที่${bname(q.to)}`); return; }
  if (q.stage !== "go" || q.to !== b.id) return;
  if (q.kind === "gig") { S.quest = null; S.questsDone++; income(q.payAmt, "job", q.title, q.e); if (q.mp) S.mp = clamp(S.mp + q.mp, 0, 100); Sound.win(); sceneStats(); await say(`สำเร็จ! +${baht(q.payAmt)} 💼`); return; }
  if (q.kind === "job") { const done = await doJob(q.game, 1.2); if (done) { S.quest = null; S.questsDone++; } scene({ e: b.e, img: "b-" + b.id, name: b.name, sub: "" }); return; }
  if (q.kind === "errand") {
    textEl.textContent = `${q.e} ${q.title}${q.cost ? ` · ${baht(q.cost)}` : ""}`;
    if (q.cost) { const ok = await payFlow(q.cost, q.title, true, q.mp ? "fun" : "other", q.e); if (!ok) { S.quest = null; return; } }
    S.quest = null; S.questsDone++;
    if (q.mp) S.mp = clamp(S.mp + q.mp, 0, 100);
    if (q.fridge) S.fridge += q.fridge;
    if (q.check) S.checkup = 2;
    if (q.study) S.team.forEach((m) => { if (!m.known) { m.known = true; S.stats.studied++; } });
    Sound.win(); sceneStats();
    await say(`สำเร็จ! ${q.mp ? `✨ +${q.mp}` : q.fridge ? `🧊 ตู้เย็นมี ${S.fridge} มื้อ` : q.check ? "🩺 ป่วยยากขึ้น 2 เดือน" : q.study ? "🔍 เห็นค่าพลังมอนแล้ว" : ""}`);

}

    if (c.k === "sellm") {

      scene({ e: b.e, img: "b-" + b.id, name: b.name, sub: "" });

/* ---------- people ---------- */
async function talk(n) {
  scene({ e: n.e, img: "n-" + n.id, name: n.name, sub: S.talked.has(n.id) ? "คุยแล้วเดือนนี้" : "มีเรื่องจะคุย" }); Sound.appear();
  if (S.talked.has(n.id)) { await say("เจอกันเดือนหน้านะ 👋"); return; }
  S.talked.add(n.id);
  if (n.talk === "tip") { await say("💡 " + pick(TIPS)); return; }
  if (n.talk === "lend") {
    const amt = Math.round(S.income * 0.08 / 100) * 100;
    await say(`ขอยืม ${baht(amt)} หน่อย เดือนหน้าคืนแน่!`);
    const c = await choose([{ k: "y", label: "🤝 ให้ยืม" }, { k: "n", label: "🙅 ไม่ให้" }]);
    if (c.k === "y") {
      if (S.wallet < amt) { await say("เงินไม่พอให้ยืม"); return; }
      S.wallet -= amt; record("🤝", "ให้เพื่อนยืม", -amt, "👛", "other"); sceneStats(); await say("ให้ยืมแล้ว หวังว่าจะได้คืน…");
      if (Math.random() < 0.55) S.pending.push({ m: S.month + 1, kind: "repay", amt });
    } else { S.mp = clamp(S.mp - 5, 0, 100); sceneStats(); await say("ปฏิเสธไป (✨ −5)"); }
  }
  if (n.talk === "chain") {
    const amt = Math.round(S.salary * 0.12 / 100) * 100;
    await say(`ป้าชวนเล่นแชร์ "2 เดือน ได้คืน 2 เท่า!" ลง ${baht(amt)}`);
    const c = await choose([{ k: "y", label: "💸 ลงเงิน", cls: "warn" }, { k: "n", label: "🧐 ขอดูหลักฐาน" }]);
    if (c.k === "y") {
      if (S.wallet + S.left < amt) { await say("เงินไม่พอ… โชคดีไป"); return; }
      quickPay(amt, "other", "ลงวงแชร์", "💸"); S.stats.scamLost += amt; S.pending.push({ m: S.month + 2, kind: "chainbust", amt }); sceneStats(); await say("โอนแล้ว… รอดูผล");
    } else { S.stats.studied++; await say("ป้าตอบไม่ได้ ไม่มีใบอนุญาต ไม่ลงดีกว่า ✔"); }
  }
  if (n.talk === "install") {
    const per = Math.round(S.salary * 0.05 / 10) * 10;
    await say("มือถือใหม่! ผ่อน 0% 10 เดือน ไม่ต้องดาวน์");
    const c = await choose([{ k: "y", label: "📲 ผ่อนเลย" }, { k: "n", label: "✋ เครื่องเดิมยังดี" }]);
    if (c.k === "y") { S.mp = clamp(S.mp + 18, 0, 100); S.installment += per; Sound.coin(); sceneStats(); await say(`ได้มือถือใหม่! ✨ +18 · ผ่อนเดือนละ ${baht(per)}`); }
    else { S.mp = clamp(S.mp - 3, 0, 100); sceneStats(); await say("อดใจได้ เงินอยู่ครบ (✨ −3)"); }
  }
  if (n.talk === "course") {
    const fee = Math.round(S.salary * 0.1 / 100) * 100;
    await say(`คอร์สเพิ่มทักษะ อาจได้ขึ้นเงินเดือน ค่าเรียน ${baht(fee)}`);
    const c = await choose([{ k: "y", label: "📚 ลงเรียน" }, { k: "n", label: "⏭️ ไว้ก่อน" }]);
    if (c.k === "y") { const ok = await payFlow(fee, "ค่าคอร์สเรียน", true, "other", "📚"); if (ok) { S.pending.push({ m: S.month + 2, kind: "raise" }); sceneStats(); await say("ลงเรียนแล้ว! 📚"); } }
    else await say("ไว้ค่อยว่ากัน");
  }
}

/* ---------- wild monsters in the meadows ---------- */
function monCard(m) {
  const D = SPECIES[m.sp], k = m.known;
  const statRow = (label, v, max, color, txt) => `<div class="stat"><span>${label}</span><span class="sbar"><i style="width:${k ? clamp((v / max) * 100, 3, 100) : 0}%;background:${color}"></i></span><span class="val">${k ? txt : "???"}</span></div>`;
  return `<div class="card mcard"><div class="orb" aria-hidden="true"><img src="${imgSrc("m-" + m.sp)}" alt=""></div><div style="min-width:0;display:flex;flex-direction:column;gap:4px">
    <h3>${D.name}</h3><div class="kind">${D.kind} · ชนิด${TYPE_TH[D.type]}</div>
    ${k ? `<div class="stars" aria-label="${m.star} ดาว">${"★".repeat(m.star)}${"☆".repeat(3 - m.star)}</div>` : `<div class="ad">โฆษณา: “${D.ad}”</div>`}
    ${statRow("⚔️ โต/ปี", m.scam ? 60 : m.ret, 15, "var(--lime)", m.scam ? "5%/ด." : m.ret.toFixed(1) + "%")}
    ${statRow("🎲 แกว่ง", m.vol, 80, "var(--sun)", m.vol.toFixed(0) + "%")}
    ${statRow("🩸 ค่าธรรม.", m.fee, 2.5, "var(--red)", m.fee.toFixed(2) + "%")}
    ${m.div > 0 || !k ? statRow("🍎 เงินสด", m.div, 6, "var(--blue)", m.div.toFixed(1) + "%") : ""}
    <div class="trait ${k && m.badTrait ? "badt" : ""}">ลักษณะ: ${k ? m.trait : "??? (ต้องศึกษาก่อน)"}</div>
  </div></div>`;
}
async function catchEvent(w) {
  const sp = w.sp, D = SPECIES[sp], m = makeMonster(sp, false);
  const p = scene({ e: D.e, img: "m-" + sp, name: D.name + " ตัวป่า", sub: "ชนิด" + TYPE_TH[D.type] }); Sound.appear(); anim("orb", "pulse");
  const extra = $("#extra", p);
  extra.innerHTML = monCard(m);
  for (;;) {
    textEl.textContent = m.known ? "จะเอายังไงดี?" : `"${D.ad}" เชื่อเลยไหม?`;
    const c = await choose([
      ...(!m.known ? [{ k: "study", label: "🔍 ศึกษาก่อน (✨ −2)", cls: "primary" }] : []),
      { k: "catch", label: m.scam ? "🎯 จับ (ต้องโอนเงินก่อน)" : "🎯 จับเข้าทีม", cls: "green" },
      { k: "pass", label: "👋 ปล่อยไป" },
    ]);
    if (c.k === "study") {
      m.known = true; S.stats.studied++; S.mp = clamp(S.mp - 2, 0, 100); extra.innerHTML = monCard(m); sceneStats();
      if (m.scam) { Sound.bad(); await say("⚠️ ไม่มีใบอนุญาต ไม่มีธุรกิจจริง = แชร์ลูกโซ่!"); }
      else await say(m.badTrait ? `ระวัง! ตัวนี้${m.trait}` : `★${m.star} · ${m.trait}`);
      continue;
    }
    if (c.k === "pass") { S.wild = S.wild.filter((x) => x !== w); await say("ปล่อยไปแล้ว 👋"); break; }
    if (S.team.length >= 4) {
      await say("ทีมเต็ม (4 ตัว) ปล่อยตัวเก่า 1 ตัว ได้เงินคืน");
      const old = await pickMonster(S.team.filter((t) => !t.scam), "ปล่อยตัวไหน?"); if (!old) continue;
      const got = old.value * SPECIES[old.sp].liq; S.wallet += got; S.team = S.team.filter((t) => t !== old); record(SPECIES[old.sp].e, `ปล่อย${SPECIES[old.sp].name} ได้เงินคืน`, got, "👛", null); sceneStats();
      await say(`ได้เงินคืน ${baht(got)}`);
    }
    if (m.scam) {
      const dep = Math.round(S.salary * 0.15 / 100) * 100;
      await say(`โอนก่อน ${baht(dep)} ถึงได้ "ผลตอบแทนการันตี"`);
      const ok = await payFlow(dep, "โอนให้ยูนิคอร์นทองคำ", true, "other", "🦄");
      if (!ok) { await say("ไม่โอน ยูนิคอร์นบินหนีไป"); S.wild = S.wild.filter((x) => x !== w); break; }
      m.value = dep; m.invested = dep; m.caughtAt = S.month; m.mStart = 0; m.mIn = dep; S.stats.scamLost += dep;
    }
    S.team.push(m); dexAdd(sp); S.wild = S.wild.filter((x) => x !== w); Sound.win(); sceneStats();
    await say(m.scam ? `โอนแล้ว ${baht(m.value)}… รอ "ผลตอบแทน"` : `จับได้แล้ว! ใส่เงินได้ที่ 📱 → 👛 กระเป๋า`); break;
  }
}

/* ---------- month end: bills, boss, report ---------- */
async function endOfMonth() {
  mode = "busy";
  S.quiet = true; if (S.t < CFG.monthSec) advance(CFG.monthSec - S.t); finishMeals(); checkOverdue(true); S.quiet = false;
  if (S.month === S.crisisMonth) await bossFight();
  monthEnd();
  const moved = S.wallet; S.left += S.wallet; S.wallet = 0;
  if (S.checkup > 0) S.checkup--;
  await report(moved);
  if (S.month >= S.months) { ending(); return; }
  S.month++; await startMonth();
}
async function bossFight() {
  const cr = pick(CRISES);
  scene({ e: cr.e, img: "x-" + cr.id, name: "บอส: " + cr.name, sub: "วิกฤตเศรษฐกิจ (สมมติ)", boss: true }); Sound.boss(); anim("orb", "shake");
  await say(`👹 ${cr.name} บุกเมือง! ${cr.text}`);
  const lines = [];
  S.team.forEach((m) => {
    if (m.scam) return; const h = cr.hit[SPECIES[m.sp].type] || 0, before = m.value; m.value *= 1 + h; m.mGrow += m.value - before;
    if (h < 0) S.rebound.push({ id: m.id, days: 2 * CFG.days, amt: -h * 0.45 });
    if (before > 0) lines.push(`${SPECIES[m.sp].e} ${h === 0 ? "รอด" : pct(h * 100, 0)}`);
  });
  if (lines.length) { Sound.hit(); await say(lines.join(" · ")); }
  if (cr.incomeHit && cr.incomeHit[S.cls]) { S.lastIncomeHit = cr.incomeHit[S.cls]; await say(`รายได้เดือนหน้า −${Math.round(cr.incomeHit[S.cls] * 100)}%`); }
  if (cr.costUp) S.costUp = 1;
  if (cr.cost) { const c = Math.round(S.income * cr.cost); await say(`ค่าเสียหาย ${baht(c)}`); await payFlow(c, cr.name, false, "emerg", cr.e); }
  const hurt = S.team.filter((m) => !m.scam && m.value > 1 && (cr.hit[SPECIES[m.sp].type] || 0) < 0);
  if (!hurt.length) { await say("ทีมรอด ไม่เจ็บมาก 💪"); return; }
  const c = await choose([
    { k: "hold", label: "🧘 ถือต่อ", cls: "primary" },
    { k: "panic", label: "🏃 ขายทิ้ง", cls: "danger" },
    { k: "buy", label: "🛒 ใช้เงินเก็บซื้อเพิ่ม", disabled: S.save < S.income * 0.1 },
  ]);
  if (c.k === "hold") await say("ถือต่อ ยังไม่ขาย = ยังไม่ขาดทุนจริง");
  if (c.k === "panic") {
    let got = 0; hurt.forEach((m) => { got += m.value * SPECIES[m.sp].liq; S.stats.soldInCrisis += m.value; S.rebound = S.rebound.filter((r) => r.id !== m.id); m.value = 0; m.invested = 0; });
    S.team = S.team.filter((m) => m.value > 1 || m.scam); S.wallet += got; record("🏃", "ขายมอนตอนวิกฤต", got, "👛", null); Sound.bad(); sceneStats(); await say(`ขายได้ ${baht(got)} · ขาดทุนจริงแล้ว`);
  }
  if (c.k === "buy") {
    const amt = Math.round(S.save * 0.5), tgt = hurt.sort((a, b) => b.value - a.value)[0];
    S.save -= amt; tgt.value += amt; tgt.invested += amt; tgt.mIn += amt; S.rebound.push({ id: tgt.id, days: 2 * CFG.days, amt: 0.04 }); Sound.coin(); sceneStats();
    await say(`ใช้เงินเก็บ ${baht(amt)} ซื้อเพิ่ม (เงินสำรองลดลง)`);
  }
}
function monthEnd() {
  S.moves = [];
  const si = S.save * 0.005 / 12; if (si > 0) { S.save += si; S.cat.saveint = si; }
  for (const m of [...S.team]) {
    if (m.scam && S.month - m.caughtAt >= 2) { S.moves.push({ m, gone: true, end: 0 }); S.team = S.team.filter((t) => t !== m); continue; }
    const cashOut = m.scam ? 0 : m.value * m.div / 100 / 12;
    if (cashOut > 0.5) { S.left += cashOut; record("🍎", `${SPECIES[m.sp].name} จ่ายเงินสด`, cashOut, "💰", "gift"); }
    S.moves.push({ m, end: m.value, cashOut });
  }
}
function report(moved) {
  return new Promise((resolve) => {
    const C = S.cat, spend = [["🍜 ค่ากิน", C.food], ["🏠 ค่าเช่า/บิล", C.bills], ["⚠️ เรื่องไม่คาดฝัน", C.emerg], ["✨ ความสุข/เที่ยว", C.fun], ["🩺 สุขภาพ", C.health], ["🛵 จิปาถะ", C.other]].filter((x) => x[1] > 0.5);
    const earn = [["🧰 งานเสริม/ภารกิจ", C.job], ["🎁 รายได้อื่น", C.gift]].filter((x) => x[1] > 0.5);
    const p = modal(`
      <div class="head"><div class="badge">📈</div><div><h2>สรุปเดือนที่ ${S.month}</h2><div class="muted">ตัวเลขจำลอง</div></div></div>
      <div class="card"><b style="font-family:var(--font-head)">📈 เงินลงทุน</b>
        <div style="overflow-x:auto"><table class="rep"><thead><tr><th>มอน</th><th class="r">ต้นเดือน</th><th class="r">ใส่เพิ่ม</th><th class="r">โต/ลด</th><th class="r">ตอนนี้</th></tr></thead><tbody>
        ${S.moves.map(({ m, gone, end }) => { const D = SPECIES[m.sp]; return `<tr><td>${D.e} ${D.name}${gone ? ' <b class="down">หายไป!</b>' : m.scam ? ' <span class="muted">(ปลอม)</span>' : ""}${m.mFee > 0.5 ? `<br><small class="muted">ค่าธรรมเนียม -${baht(m.mFee)}</small>` : ""}</td>
          <td class="r num">${baht(m.mStart)}</td><td class="r num">${m.mIn ? "+" + baht(m.mIn) : "-"}</td><td class="r num ${m.mGrow >= 0 && !gone ? "up" : "down"}">${gone ? "-" + baht(m.value) : (m.mGrow >= 0 ? "+" : "") + baht(m.mGrow)}</td><td class="r num">${baht(end)}</td></tr>`; }).join("") || `<tr><td colspan="5">ยังไม่มีมอน</td></tr>`}
        </tbody></table></div>
      </div>
      ${S.moves.some((x) => x.gone) ? `<p class="hint red">🦄 ยูนิคอร์นหายไปพร้อมเงิน = แชร์ลูกโซ่</p>` : ""}
      <div class="card"><b style="font-family:var(--font-head)">👛 เงินไปไหน</b><div class="lines" style="margin-top:4px">
        <div><span>💼 เงินเดือน</span><b class="up">+${baht(S.income)}</b></div>
        ${earn.map(([n, v]) => `<div><span>${n}</span><b class="up">+${baht(v)}</b></div>`).join("")}
        ${spend.map(([n, v]) => `<div><span>${n}</span><b class="down">-${baht(v)}</b></div>`).join("")}
      </div></div>
      <div class="card grid2">
        <div><span class="muted">💰 เงินเหลือ</span><br><b class="num">${baht(S.left)}</b></div>
        <div><span class="muted">🐷 เงินเก็บ</span><br><b class="num">${baht(S.save)}</b></div>
        <div><span class="muted">📈 ลงทุน</span><br><b class="num">${baht(invTotal())}</b></div>
        <div><span class="muted">💳 หนี้บัตร</span><br><b class="num ${S.debt > 0.5 ? "down" : ""}">${baht(S.debt)}</b></div>
        <div><span class="muted">✨ ความสุข</span><div class="bar mp"><i style="width:${S.mp}%"></i></div></div>
        <div><span class="muted">💎 สุทธิ</span><br><b class="num">${baht(netWorth())}</b></div>
      </div>
      ${S.debt > 0.5 ? `<p class="hint">💳 ค้างถึงเดือนหน้า โดนหักเอง</p>` : ""}
      <button class="btn green" id="nx">${S.month < S.months ? `ไปเดือนที่ ${S.month + 1} →` : "ดูผลรวม 🏆"}</button>`);
    Sound.win();
    $("#nx", p).onclick = () => { Sound.blip(); resolve(); };
  });
}
function ending() {
  mode = "busy"; S.over = true;
  const inv = invTotal(), net = netWorth(), ratio = net / Math.max(1, S.incomeTotal);
  const score = Math.max(0, Math.round((ratio * 1000 + S.mp * 4 + S.questsDone * 6) * (0.6 + 0.4 * S.mp / 100)));
  const rank = score >= 700 ? "ปรมาจารย์การเงิน" : score >= 520 ? "จอมจัดงบ" : score >= 350 ? "นักวางแผนฝึกหัด" : "มือใหม่หัดออม";
  const best = store.get(BEST_KEY, 0), isBest = score > best; if (isBest) store.set(BEST_KEY, score);
  const dex = store.get(DEX_KEY, []);
  const L = [];
  L.push(`🍜 ค่ากิน ${baht(S.foodSpent)} · เล็กๆ รวมกันก็ก้อนใหญ่`);
  if (S.stats.shieldUses) L.push(`🐷 เงินเก็บช่วยไว้ ${S.stats.shieldUses} ครั้ง ไม่ต้องเป็นหนี้`);
  if (S.stats.cardInterest > 1) L.push(`💳 เสียดอกเบี้ยบัตร ${baht(S.stats.cardInterest)}`);
  if (S.stats.autoDebt > 1) L.push(`⚠️ โดนหักหนี้ค้าง ${baht(S.stats.autoDebt)}`);
  if (S.stats.failed) L.push(`⌛ ไปนัดไม่ทัน ${S.stats.failed} ครั้ง`);
  if (S.stats.late) L.push(`⏰ จ่ายบิลช้า ${S.stats.late} ครั้ง โดนปรับ`);
  if (S.stats.feesPaid > 1) L.push(`🩸 ค่าธรรมเนียม ${baht(S.stats.feesPaid)} · ถือนานยิ่งเห็นชัด`);
  if (S.stats.scamLost > 0) L.push(`🦄 เสียให้แชร์ลูกโซ่ ${baht(S.stats.scamLost)} · การันตีสูง = ระวัง`);
  if (S.stats.soldInCrisis > 0) L.push("🏃 ขายตอนวิกฤต = ขาดทุนจริง");
  if (S.jobsDone) L.push(`🧰 ทำงานเสริม ${S.jobsDone} ครั้ง`);
  const p = modal(`
    <div class="head"><div class="badge">🏆</div><div><h2>จบ ${S.months} เดือน</h2><div class="rank">${rank}</div></div></div>
    <div class="card" style="text-align:center"><div class="big">${score.toLocaleString("en-US")}</div><div class="muted">คะแนน${isBest ? " · สถิติใหม่!" : " · สถิติ " + best.toLocaleString("en-US")}</div></div>
    <div class="card grid2">
      <div><span class="muted">รายได้รวม</span><br><b class="num">${baht(S.incomeTotal)}</b></div><div><span class="muted">สุทธิ</span><br><b class="num">${baht(net)}</b></div>
      <div><span class="muted">💰+👛 เงินเหลือ</span><br><b class="num">${baht(S.left + S.wallet)}</b></div><div><span class="muted">🐷 เงินเก็บ</span><br><b class="num">${baht(S.save)}</b></div>
      <div><span class="muted">📈 ลงทุน</span><br><b class="num">${baht(inv)}</b></div><div><span class="muted">💳 หนี้</span><br><b class="num">${baht(S.debt)}</b></div>
      <div><span class="muted">🎯 ภารกิจสำเร็จ</span><br><b class="num">${S.questsDone}</b></div><div><span class="muted">✨ ความสุข</span><br><b class="num">${Math.round(S.mp)}</b></div>
    </div>
    <div class="card"><h3>ข้อสังเกต</h3><ul class="lessons">${L.map((l) => `<li>${l}</li>`).join("")}</ul></div>
    <p class="muted">สมุดสะสม ${dex.length}/${Object.keys(SPECIES).length} · รอบหน้าเจอเรื่องใหม่</p>
    <p class="foot">ทุกอย่างในเกมเป็นการจำลอง ไม่ใช่คำแนะนำการลงทุน</p>
    <button class="btn primary" id="again">เล่นอีกรอบ</button>`);
  Sound.win();
  $("#again", p).onclick = () => { Sound.blip(); title(); disclaimer(); };
}
